<!--Table START-->
<div class="mb-2">
    <button  mat-flat-button type="button" [color]="'primary'" (click)="createCore()">
      Criar núcleo
    </button>
</div>
  
<div class="mat-elevation-z2 table">
    <table mat-table [dataSource]="dataSource">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>
  
      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef class="description-title"> Descrição </th>
        <td mat-cell *matCellDef="let element"> {{element.description}} </td>
      </ng-container>

      <!-- Action Buttons -->
      <ng-container matColumnDef="action">
        <th mat-header-cell mat-sort-header *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">

            <!--Criar Função-->
            <button mat-menu-item (click)="toTeam(team)">
              <mat-icon class="icon-size-4 text-gray-600" svgIcon="heroicons_outline:user-group"></mat-icon>
              <span>Ver Time</span>
            </button>

            <!--Criar Função-->
            <button mat-menu-item (click)="editCore()">
              <mat-icon class="icon-size-4 text-gray-600" svgIcon="edit"></mat-icon>
              <span>Editar</span>
            </button>

            <!--Criar Função-->
            <button mat-menu-item (click)="removeCore()">
              <mat-icon class="icon-size-4 text-gray-600" svgIcon="remove_circle_outline"></mat-icon>
              <span>Remover</span>
            </button>

          </mat-menu>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[12, 24, 36]"
                   showFirstLastButtons
                   aria-label="Select page">
    </mat-paginator>
</div>
<!--Table END-->
