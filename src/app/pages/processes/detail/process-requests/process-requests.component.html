<div class="xl:col-span-2 flex flex-col flex-auto overflow-hidden">
  <!-- Actions -->
  <div
    class="flex shrink-0 items-center sm:mt-0 py-8 px-6 md:px-6 justify-between"
  >
    <!-- Search -->
    <mat-form-field
      class="fuse-mat-dense fuse-mat-rounded min-w-64"
      [subscriptSizing]="'dynamic'"
    >
      <mat-icon
        class="icon-size-5"
        matPrefix
        [svgIcon]="'heroicons_solid:search'"
      ></mat-icon>
      <input
        matInput
        [autocomplete]="'off'"
        [placeholder]="'Buscar'"
        [formControl]="searchInputControl"
      />
    </mat-form-field>
    <!-- Add product button -->
    <button
      class="ml-4"
      mat-flat-button
      [color]="'primary'"
      (click)="openDialog()"
      *hasPermission="'create-ProcessRequest'"
    >
      <span class="ml-2 mr-1">Novo Pedido</span>
    </button>
  </div>
  <div
    class="xl:col-span-2 flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden mx-6"
  >
    <div class="overflow-x-auto mx-6" style="padding: 20px">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="request">
          <th mat-header-cell *matHeaderCellDef>Pedido</th>
          <td mat-cell *matCellDef="let element">
            {{ element.request }}
          </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Data</th>
          <td mat-cell *matCellDef="let element">
            {{ element.date | date : 'dd/MM/yyyy' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="lossProbability">
          <th mat-header-cell *matHeaderCellDef>Probabilidade de perda</th>
          <td mat-cell *matCellDef="let element">
            {{ element.lossProbability }}
          </td>
        </ng-container>

        <ng-container matColumnDef="provisionedValue">
          <th mat-header-cell *matHeaderCellDef>Valor provisionado</th>
          <td mat-cell *matCellDef="let element">
            {{
              element.provisionedValue
                | currency : 'BRL' : 'symbol-narrow' : '1.2-2'
            }}
          </td>
        </ng-container>

        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef>Valor</th>
          <td mat-cell *matCellDef="let element">
            {{ element.value | currency : 'BRL' : 'symbol-narrow' : '1.2-2' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element" class="text-end">
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              aria-label="Example icon-button with a menu"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button
                mat-menu-item
                (click)="edit(element)"
                *hasPermission="'edit-ProcessRequest'"
              >
                <mat-icon
                  class="icon-size-4 text-gray-600"
                  svgIcon="edit"
                ></mat-icon>
                <span>Editar</span>
              </button>
              <button
                mat-menu-item
                (click)="removeDialog(element)"
                *hasPermission="'remove-ProcessRequest'"
              >
                <mat-icon
                  class="icon-size-4 text-gray-600"
                  svgIcon="remove_circle_outline"
                ></mat-icon>
                <span>Remover</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
      <mat-paginator
        [pageSizeOptions]="[12, 24, 36]"
        [showFirstLastButtons]="true"
      >
      </mat-paginator>
    </div>
  </div>
</div>
