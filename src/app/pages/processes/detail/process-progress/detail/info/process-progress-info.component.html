<div class="grid grid-cols-1 md:grid-cols-1 my-4">
  <h1 class="font-semibold tracking-wide uppercase text-blue-800">
    Informações gerais
  </h1>
</div>

<div class="grid grid-cols-2 gap-4 mt-4">
  <div>
    <p class="text-gray-900 font-bold">
      {{ info?.resource ? 'Recurso' : 'Processo' }}:
      <span class="font-light">{{
        info?.resource ? info.resource.number : info.process.caseNumber
      }}</span>
    </p>
  </div>
  <div>
    <p class="text-gray-900 font-bold">
      Tipo:
      <span class="font-light">{{ info.type?.name }}</span>
    </p>
  </div>
</div>
<div class="grid grid-cols-3 gap-4 mt-4">
  <div>
    <p class="text-gray-900 font-bold">
      Notas: <span class="font-light">{{ info.desc }}</span>
    </p>
  </div>
</div>

<div class="flex items-center justify-end">
  <button
    mat-stroked-button
    type="button"
    [color]="'secondary'"
    (click)="back()"
  >
    Voltar
  </button>
</div>
