<form [formGroup]="form" class="flex flex-col mt-5">
  <div class="grid w-full">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col">
        <mat-form-field class="flex-auto gt-xs:pl-3">
          <mat-label>Tipo</mat-label>
          <mat-select formControlName="guarantee">
            <mat-option [value]="opt" *ngFor="let opt of types">{{
              opt
            }}</mat-option>
          </mat-select>
          <mat-error ga-form-field-errors></mat-error>
        </mat-form-field>
      </div>
      <div class="flex flex-col">
        <mat-form-field class="w-full">
          <mat-label>Valor </mat-label>
          <input
            matInput
            formControlName="price"
            type="text"
            prefix="R$ "
            mask="separator.2"
            thousandSeparator="."
            decimalMarker=","
          />
          <mat-error ga-form-field-errors></mat-error>
        </mat-form-field>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col">
        <mat-form-field class="w-full">
          <mat-label>Data </mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            formControlName="date"
          />
          <mat-datepicker-toggle
            matIconSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error ga-form-field-errors></mat-error>
        </mat-form-field>
      </div>
      
    </div>
    <div class="grid grid-cols-1 gap-4">
      <div class="flex flex-col">
        <mat-form-field class="w-full">
          <mat-label>Observação </mat-label>
          <textarea
            matInput
            type="text"
            formControlName="observation"
          ></textarea>
          <mat-error ga-form-field-errors></mat-error>
        </mat-form-field>
      </div>
    </div>
    <div class="flex items-center justify-end">
      <button
        mat-stroked-button
        type="button"
        [color]="'default'"
        (click)="back()"
      >
        Voltar
      </button>
      <button
        class="ml-4"
        mat-flat-button
        type="button"
        [color]="'primary'"
        (click)="onSubmit()"
        [disabled]="!form.valid || isLoading"
      >
        {{ editId ? 'Editar' : 'Cadastrar' }}
      </button>
    </div>
  </div>
</form>
