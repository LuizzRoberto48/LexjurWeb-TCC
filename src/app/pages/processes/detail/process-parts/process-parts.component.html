<div class="xl:col-span-2 flex flex-col flex-auto overflow-hidden">
  <!-- Actions -->
  <div
    class="flex shrink-0 items-center sm:mt-0 py-8 px-6 md:px-6 justify-between"
  >
    <!-- Search -->
    <mat-form-field
      class="fuse-mat-dense fuse-mat-rounded min-w-64"
      [subscriptSizing]="'dynamic'"
    >
      <mat-icon
        class="icon-size-5"
        matPrefix
        [svgIcon]="'heroicons_solid:search'"
      ></mat-icon>
      <input matInput [autocomplete]="'off'" [placeholder]="'Buscar'" [formControl]="searchInputControl"/>
    </mat-form-field>
    <!-- Add product button -->
    <button class="ml-4" mat-flat-button [color]="'primary'" (click)="openDialog()" *hasPermission="'create-ProcessParts'">
      <span class="ml-2 mr-1">Nova parte</span>
    </button>
  </div>
  <div
    class="xl:col-span-2 flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden mx-6"
  >
    <div class="overflow-x-auto mx-6" style="padding: 20px">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="personType">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let element">
            {{ getPersonType(element.personType) }}
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let element">
            {{ element.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef>Posição</th>
          <td mat-cell *matCellDef="let element">
            {{ element.position }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element" class="text-end">
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="edit(element)" *hasPermission="'edit-ProcessParts'">
                <mat-icon
                  class="icon-size-4 text-gray-600"
                  svgIcon="edit"
                ></mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item (click)="removeDialog(element)" *hasPermission="'remove-ProcessParts'">
                <mat-icon
                  class="icon-size-4 text-gray-600"
                  svgIcon="remove_circle_outline"
                ></mat-icon>
                <span>Remover</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
      <mat-paginator
        [pageSizeOptions]="[12, 24, 36]"
        [showFirstLastButtons]="true"
      >
      </mat-paginator>
    </div>
  </div>
</div>
