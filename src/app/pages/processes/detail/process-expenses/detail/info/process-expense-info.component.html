<div class="grid grid-cols-1 md:grid-cols-1 my-4">
  <h1 class="font-semibold tracking-wide uppercase text-blue-800">
    Informações gerais
  </h1>
</div>

<div class="grid grid-cols-3 gap-4 mt-4">
  <p class="text-gray-900 font-bold">
    Processo
    <span class="font-light">{{ info.process.caseNumber }}</span>
  </p>

  <p class="text-gray-900 font-bold">
    Tipo:
    <span class="font-light">{{ info.type }}</span>
  </p>
  <p class="text-gray-900 font-bold">
    Reembolsável ?: <span class="font-light">{{ info.isRefundable ? 'Sim' : 'Não' }}</span>
  </p>
</div>
<div class="grid grid-cols-2 gap-4 mt-4">
  <div class="flex flex-col">
    <p class="text-gray-900 font-bold">
      Data de expiração:
      <span class="font-light">{{
        info.expirationDate | date : 'dd/MM/yyyy'
      }}</span>
    </p>
  </div>
  <div class="flex flex-col">
    <p class="text-gray-900 font-bold" *ngIf="info.paymentDate">
      Data do pagamento: <span class="font-light">{{ info.paymentDate }}</span>
    </p>
  </div>
</div>
<div class="grid grid-cols-1 gap-4 mt-4">
  <p class="text-gray-900 font-bold">
    Observação : <span class="font-light">{{ info.observation }}</span>
  </p>
</div>
<div class="flex items-center justify-end">
  <button
    mat-stroked-button
    type="button"
    [color]="'secondary'"
    (click)="back()"
  >
    Voltar
  </button>
</div>
