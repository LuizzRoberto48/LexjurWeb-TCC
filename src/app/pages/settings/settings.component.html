<div
  class="flex flex-col w-full min-w-0 sm:absolute sm:inset-0 sm:overflow-hidden"
>
  <mat-drawer-container class="flex-auto sm:h-full">
    <mat-drawer
      class="sm:w-96 dark:bg-gray-900"
      [autoFocus]="false"
      [mode]="drawerMode"
      [opened]="drawerOpened"
      #drawer
    >
      <div class="flex items-center justify-between m-8 mr-6 sm:my-10">
        <div class="text-4xl font-extrabold tracking-tight leading-none">
          Perfil
        </div>
        <div class="lg:hidden">
          <button mat-icon-button (click)="drawer.close()">
            <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
          </button>
        </div>
      </div>
      <div class="flex flex-col divide-y border-t border-b">
        <ng-container *ngFor="let panel of panels; trackBy: trackByFn">
          <div
            class="flex px-8 py-5 cursor-pointer"
            [ngClass]="{
              'hover:bg-gray-100 dark:hover:bg-hover':
                !selectedPanel || selectedPanel !== panel.id,
              'bg-primary-50 dark:bg-hover':
                selectedPanel && selectedPanel === panel.id
            }"
            (click)="goToPanel(panel.id)"
          >
            <mat-icon
              [ngClass]="{
                'text-hint': !selectedPanel || selectedPanel !== panel.id,
                'text-primary dark:text-primary-500':
                  selectedPanel && selectedPanel === panel.id
              }"
              [svgIcon]="panel.icon"
            ></mat-icon>
            <div class="ml-3">
              <div
                class="font-medium leading-6"
                [ngClass]="{
                  'text-primary dark:text-primary-500':
                    selectedPanel && selectedPanel === panel.id
                }"
              >
                {{ panel.title }}
              </div>
              <div class="mt-0.5 text-secondary">
                {{ panel.description }}
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </mat-drawer>

    <mat-drawer-content class="flex flex-col">
      <div *ngIf="selectedPanel != 'team'">
        <header-content
          [titleIcon]="getPanelInfo(selectedPanel).icon"
          [title]="getPanelInfo(selectedPanel).title"
          [desc]="getPanelInfo(selectedPanel).description"
          [descIcon]="'contacts'"
        >
        </header-content>

        <div class="flex-auto px-6 pb-12 md:px-8 md:pb-12 pt-2">
          <div class="flex items-center">
            <button
              class="lg:hidden -ml-2"
              mat-icon-button
              (click)="drawer.toggle()"
            >
              <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
            </button>
          </div>

          <div class="mt-8">
            <ng-container [ngSwitch]="selectedPanel">
              <!-- Account -->
              <ng-container *ngSwitchCase="'account'">
                <settings-account></settings-account>
              </ng-container>
              <!-- Cores -->
              <ng-container *ngSwitchCase="'core'">
                <settings-core></settings-core>
              </ng-container>
            </ng-container>
          </div>
        </div>
      </div>
      <ng-container [ngSwitch]="selectedPanel">
        <ng-container *ngSwitchCase="'team'">
          <mat-drawer-container class="sm:h-full">
            <details-component></details-component>

            <!--Details Drawer-->
            <mat-drawer
              mode="over"
              position="end"
              [opened]="drawerTeamOpened"
              (closedStart)="drawerClose()"
              class="w-full md:w-160 dark:bg-gray-900"
              #drawerTeam
            >
              <user-detail
                (closeDrawer)="drawerClose($event)"
                [lawyerInfo]="lawyerInfo"
              ></user-detail>
            </mat-drawer>

            <!--TESTE-->
            <mat-drawer-content>
              <header-content
                [titleIcon]="getPanelInfo(selectedPanel).icon"
                [title]="getPanelInfo(selectedPanel).title"
                [desc]="getPanelInfo(selectedPanel).description"
                [descIcon]="'contacts'"
              >
              </header-content>
              <div class="flex-auto px-6 pb-12 md:px-8 md:pb-12 pt-2">
                <div class="flex items-center">
                  <button
                    class="lg:hidden -ml-2"
                    mat-icon-button
                    (click)="drawer.toggle()"
                  >
                    <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
                  </button>
                </div>
                <settings-team
                  (openDrawer)="drawerOpen($event)"
                  (lawyerInfo)="getLawyerInfo($event)"
                ></settings-team>
              </div>
            </mat-drawer-content>
          </mat-drawer-container>
        </ng-container>
      </ng-container>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
