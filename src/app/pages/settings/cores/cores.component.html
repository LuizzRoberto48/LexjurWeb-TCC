<div class="bg-card shadow rounded-2xl w-full inset-0 flex flex-col min-w-0 overflow-hidden">
  <div class="overflow-x-auto mx-6 h-full py-5" >
    <table mat-table [dataSource]="coresDataSource">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let item"> {{item.name}} </td>
      </ng-container>
  
      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef class="text-lg"> Descrição </th>
        <td mat-cell *matCellDef="let item" class="italic"> {{item.description}} </td>
      </ng-container>

      <!-- Action Buttons -->
      <ng-container matColumnDef="action">
        <th mat-header-cell mat-sort-header *matHeaderCellDef class="padding-0">
          <button  mat-flat-button type="button" [color]="'primary'" (click)="createCore()">
          Criar núcleo
          </button> 
        </th>
        <td mat-cell *matCellDef="let item" class="text-right">
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="goToTeam('team')">
              <mat-icon class="icon-size-4 text-gray-600" svgIcon="heroicons_outline:user-group"></mat-icon>
              <span>Ver Time</span>
            </button>

            <button mat-menu-item (click)="editCore(item)">
              <mat-icon class="icon-size-4 text-gray-600" svgIcon="edit"></mat-icon>
              <span>Editar</span>
            </button>

            <!--Criar Função-->
            <button mat-menu-item (click)="removeCore(item.id)">
              <mat-icon class="icon-size-4 text-gray-600" svgIcon="remove_circle_outline"></mat-icon>
              <span>Remover</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    
  </div>
  <mat-paginator [pageSizeOptions]="pageSizeOptions"
                  aria-label="Select page">
    </mat-paginator>
</div>
<!--Table END-->
