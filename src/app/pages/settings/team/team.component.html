<!-- Team members -->
<div>
  <button
    class="mt-4 lg:mt-6 bg-gray-300"
    mat-flat-button
    type="button"
    changeCore
  >
    Núcleo: <span>{{ coreName }}</span>
  </button>
</div>
<div class="w-full">
  <div class="flex flex-col mt-4 sm:mt-0 divide-y">
    <div
      class="flex-auto border-t pt-4 sm:pt-4 bg-card shadow sm:rounded-2xl sm:mx-0 sm:my-5"
    >
      <div
        class="relative w-full max-w-screen-xl"
        style="min-height: 45vh"
      >
        <ng-container *ngFor="let lawyer of lawyers">
          <div class="flex flex-row sm:items-center py-4 px-5">
            <div class="flex items-center">
              <div
                class="flex flex-0 items-center justify-center w-10 h-10 rounded-full overflow-hidden"
              >
                <ng-container *ngIf="false">
                  <img
                    class="object-cover w-full h-full"
                    [src]="lawyer.avatar"
                    alt="Contact avatar"
                  />
                </ng-container>
                <ng-container *ngIf="true">
                  <div
                    class="flex items-center justify-center w-full h-full rounded-full text-lg uppercase bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-200"
                  >
                    {{ lawyer?.name.charAt(0) }}
                  </div>
                </ng-container>
              </div>
              <div class="ml-4">
                <div class="font-medium">{{ lawyer?.name }}</div>
                <div class="text-secondary">{{ lawyer.user?.email }}</div>
                <div class="text-secondary">{{ lawyer?.oab }}</div>
              </div>
            </div>
            <div class="flex items-center mt-4 sm:mt-0 ml-auto">
              <button
                mat-icon-button
                (click)="drawerActions(openDrawer, lawyer)"
              >
                <mat-icon
                  class="text-hint"
                  [svgIcon]="'heroicons_outline:arrow-circle-right'"
                ></mat-icon>
              </button>
            </div>
          </div>
          <hr class="my-3" />
        </ng-container>
      </div>
      <mat-paginator
        class="rounded-2xl"
        [pageSizeOptions]="pageSizeOptions"
        aria-label="Select page"
      >
        >
      </mat-paginator>
    </div>
  </div>
</div>
