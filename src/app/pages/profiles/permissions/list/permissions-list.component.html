<div class="w-full max-w-screen-xl mx-auto">
  <ng-container *ngFor="let member of members">
    <div class="flex sm:flex-row flex-col sm:items-center py-4 px-3">
      <div class="flex items-center">
        <div class="ml-2">
          <div class="font-medium">{{ member.name }}</div>
          <div class="text-secondary">{{ member.desc }}</div>
        </div>
      </div>
      <div class="flex items-center mt-4 sm:mt-0 ml-auto">
        <!-- Labels -->
        <div class="w-full">
          <div
            class="mt-1 rounded-md border border-gray-300 shadow-sm overflow-hidden mr-5"
          >
            <!-- Header -->
            <div class="flex items-center my-2 mx-3">
              <div class="flex items-center flex-auto min-w-0">
                <mat-icon
                  class="icon-size-5"
                  [svgIcon]="'heroicons_solid:search'"
                ></mat-icon>
                <input
                  class="min-w-0 ml-2 py-1 border-0"
                  type="text"
                  placeholder="Regras"
                  (input)="filterLabels($event)"
                  (keydown)="filterLabelsInputKeyDown($event)"
                  [maxLength]="50"
                />
              </div>
            </div>
            <!-- Available labels -->
            <div class="max-h-20 leading-none overflow-y-auto border-t">
              <!-- Labels -->
              <ng-container *ngFor="let label of labels; trackBy: trackByFn">
                <mat-checkbox
                  [disabled]="true"
                  class="flex items-center h-10 min-h-10 pl-1 pr-4"
                  [color]="'primary'"
                  [checked]="hasLabel(label)"
                  (change)="toggleProductTag(label, $event)"
                >
                  {{ label.title }}
                </mat-checkbox>
              </ng-container>
            </div>
          </div>
        </div>
        <button mat-icon-button>
          <mat-icon
            class="text-hint"
            [svgIcon]="'heroicons_outline:arrow-circle-right'"
          ></mat-icon>
        </button>
      </div>
    </div>
    <hr />
  </ng-container>
  <mat-paginator> </mat-paginator>
</div>
