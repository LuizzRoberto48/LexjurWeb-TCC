<div class="flex flex-col flex-auto w-full">

  <div class="flex flex-wrap w-full max-w-screen-xl mx-auto p-6 md:p-8">
    <!-- Title and action buttons -->
    <div class="flex items-center justify-between w-full">
      <div>
        <div class="text-3xl font-semibold tracking-tight leading-8">Informações Gerais</div>
        <div class="font-medium tracking-tight text-secondary">Monitorar métricas para tomar melhor decisão
        </div>
      </div>

    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 w-full mt-8">
      <!-- Summary -->
      <div class="flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden">
        <div class="flex items-start justify-between">
          <div class="text-lg font-medium tracking-tight leading-6 truncate">Processos</div>
          <div class="ml-2 -mt-2 -mr-3">
            <button mat-icon-button [matMenuTriggerFor]="summaryMenu">
              <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:dots-vertical'"></mat-icon>
            </button>
            <mat-menu #summaryMenu="matMenu">
              <button mat-menu-item routerLink="/processos">Ver mais</button>
            </mat-menu>
          </div>
        </div>
        <div class="flex flex-col items-center mt-2">
          <div class="text-7xl sm:text-8xl font-bold tracking-tight leading-none text-blue-500">{{$countProcess | async}}</div>
          <div class="text-lg font-medium text-blue-600 dark:text-blue-500">Processos cadastrados</div>
          <div class="flex items-baseline justify-center w-full mt-5 text-secondary">
            <div class="ml-1.5 text-lg font-semibold"></div>
          </div>
        </div>
      </div>
    </div>


  </div>
</div>
