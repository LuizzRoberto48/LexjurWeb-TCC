<!-- Button -->
<button mat-icon-button [matMenuTriggerFor]="userActions">
  <span class="relative">
    <img class="w-7 h-7 rounded-full" *ngIf="showAvatar && authUser?.avatar" [src]="authUser?.avatar">
    <mat-icon *ngIf="!showAvatar || !authUser?.avatar" [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
  </span>
</button>

<mat-menu [xPosition]="'before'" #userActions="matMenu">
  <button mat-menu-item>
    <span class="flex flex-col leading-none">
      <span class="mt-1.5 text-md font-medium">{{authUser?.email.split('@')[0]}}</span>
      <span class="mt-1.5 text-md font-bold text-primary-600">{{authUser?.isAdmin ? 'ADMIN' : 'CLIENTE'}}</span>
    </span>
  </button>
  <mat-divider class="my-2"></mat-divider>
  <button mat-menu-item [routerLink]="['/profile']">
    <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
    <span>Perfil</span>
  </button>
  <button mat-menu-item  changeCore>
    <mat-icon [svgIcon]="'heroicons_outline:home'"></mat-icon>
    <span class="flex flex-col leading-none">
      <span class="mt-1.5 text-md font-medium">Núcleo</span>
      <span class="mt-1.5 text-md font-bold text-primary-600">{{coreName}}</span>
    </span>
  </button>
  <mat-divider class="my-2"></mat-divider>
  <button mat-menu-item (click)="signOut()">
    <mat-icon [svgIcon]="'heroicons_outline:logout'"></mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
