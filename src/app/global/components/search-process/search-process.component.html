<mat-accordion >
  <mat-expansion-panel [expanded]="true">
    <mat-expansion-panel-header class="header-center">
      <mat-panel-title class="flex flex-center justify-between">
        <p class="text-primary-600 font-bold">Buscar Processos</p>
      </mat-panel-title>
    </mat-expansion-panel-header>
  
    <form [formGroup]="form" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="flex flex-col">
        <mat-form-field class="w-full">
          <mat-label>Id</mat-label>
          <input matInput type="number" formControlName="id" (blur)="changedId()"/>
        </mat-form-field>
      </div>
      <div class="flex flex-col">
        <mat-form-field class="w-full">
          <mat-label>Número do caso</mat-label>
          <input matInput type="text" formControlName="caseNumber" />
        </mat-form-field>
      </div>
      <div class="flex flex-col">
        <mat-form-field class="flex-auto gt-xs:pl-3">
          <mat-label>UF</mat-label>
          <mat-select formControlName="uf" (selectionChange)="changeUfs()">
            <mat-option [value]="''"></mat-option>
            <mat-option [value]="opt.name" *ngFor="let opt of ufs">{{
              opt.name
            }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="flex flex-col">
        <mat-form-field class="flex-auto gt-xs:pl-3">
          <mat-label>Comarca</mat-label>
          <mat-select formControlName="county">
            <mat-option [value]="''"></mat-option>
            <mat-option [value]="opt.id" *ngFor="let opt of counties">{{
              opt.name
            }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="flex flex-col">
        <mat-form-field class="flex-auto gt-xs:pl-3">
          <mat-label>Cliente</mat-label>
          <mat-select formControlName="client">
            <mat-option [value]="''"></mat-option>
            <mat-option [value]="opt.id" *ngFor="let opt of clients">{{
              opt.name
            }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </form>
    <div class="flex items-center justify-end">
      <button
        class="ml-4"
        mat-flat-button
        type="button"
        [color]="'primary'"
        (click)="search()"
      >
        Buscar
      </button>
    </div>
  </mat-expansion-panel>
</mat-accordion>
