<div class="flex flex-col sm:flex-row items-center md:items-start sm:justify-center md:justify-start flex-auto min-w-0 sm:bg-gray-800">
  <div
    class="md:flex md:items-center md:justify-center w-full sm:w-auto md:h-full md:w-1/2 py-8 px-4 sm:p-12 md:p-16 sm:rounded-2xl md:rounded-none sm:shadow md:shadow-none sm:bg-card">
    <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">
      <!-- Logo -->
      <img src="assets/images/logo/logo_lexjur_fundo_branco2.png">
      <!-- Title -->
      <div class="mt-8 text-4xl font-bold tracking-tight leading-tight text-primary-500">Entrar</div>

      <!-- Alert -->
      <fuse-alert class="mt-8" *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type"
        [@shake]="alert.type === 'error'">
        {{alert.message}}
      </fuse-alert>

      <!-- Sign in form -->
      <form class="mt-8" [formGroup]="signInForm" #signInNgForm="ngForm" (ngSubmit)="signIn()">

        <!-- Email field -->
        <mat-form-field class="w-full">
					<mat-label>E-mail</mat-label>
					<input id="email" matInput [formControlName]="'email'">
					<mat-error *ngIf="signInForm.get('email').hasError('required')">
						E-mail é obrigatório.
					</mat-error>
					<mat-error *ngIf="signInForm.get('email').hasError('email')">
						Adicione um e-mail válido.
					</mat-error>
				</mat-form-field>

        <!-- Password field -->
        <mat-form-field class="w-full">
          <mat-label>Senha</mat-label>
          <input id="password" matInput type="password" [formControlName]="'password'" #passwordField>
          <button mat-icon-button type="button"
            (click)="passwordField.type === 'password' ? passwordField.type = 'text' : passwordField.type = 'password'"
            matSuffix>
            <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'password'"
              [svgIcon]="'heroicons_solid:eye'"></mat-icon>
            <mat-icon class="icon-size-5" *ngIf="passwordField.type === 'text'"
              [svgIcon]="'heroicons_solid:eye-off'"></mat-icon>
          </button>
          <mat-error>
            Senha é obrigatória
          </mat-error>
        </mat-form-field>

        <!-- Actions -->
        <div class="inline-flex items-center justify-end w-full mt-1.5">
          <!-- <mat-checkbox class="-ml-2" [color]="'primary'" [formControlName]="'rememberMe'">
            Manter logado
          </mat-checkbox> -->
          <a class="text-md font-medium text-primary-500 hover:underline" [routerLink]="['/sign-in/forgot']">Esqueci a senha
          </a>
        </div>

        <!-- Submit button -->
        <button class="fuse-mat-button-large w-full mt-6" mat-flat-button [color]="'primary'"
          [disabled]="signInForm.disabled" >
          <span *ngIf="!signInForm.disabled">
            Entrar
          </span>
          <mat-progress-spinner *ngIf="signInForm.disabled" [diameter]="24"
            [mode]="'indeterminate'"></mat-progress-spinner>
        </button>
      </form>
    </div>
  </div>
  <div
    class="relative hidden md:flex flex-auto items-center justify-center w-1/2 h-full p-16 lg:px-28 overflow-hidden bg-gray-800 dark:border-l">
    <!-- Background - @formatter:off -->
    <!-- Rings -->
    <svg class="absolute inset-0 pointer-events-none" viewBox="0 0 960 540" width="100%" height="100%"
      preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <g class="text-gray-700 opacity-25" fill="none" stroke="currentColor" stroke-width="100">
        <circle r="234" cx="196" cy="23"></circle>
        <circle r="234" cx="790" cy="491"></circle>
      </g>
    </svg>
    <!-- Dots -->
    <svg class="absolute -top-16 -right-16 text-gray-700" viewBox="0 0 220 192" width="220" height="192" fill="none">
      <defs>
        <pattern id="837c3e70-6c3a-44e6-8854-cc48c737b659" x="0" y="0" width="20" height="20"
          patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="4" height="4" fill="currentColor"></rect>
        </pattern>
      </defs>
      <rect width="220" height="192" fill="url(#837c3e70-6c3a-44e6-8854-cc48c737b659)"></rect>
    </svg>
    
    <div class="z-10 relative w-full max-w-2xl">
      <h1 class="text-3xl font-bold tracking-tight leading-tight text-white text-center uppercase mt-10">
        A plataforma de gerenciamento de processos. 
      </h1>
      <img src="assets/images/logo/icon-transparent.svg" style="width: 70%;margin: 0 auto;">
      <!-- <div class="mt-6 text-lg tracking-tight leading-6 text-gray-400">
      </div> -->
    </div>
  </div>
</div>
