<div class="xl:col-span-2 flex flex-col flex-auto overflow-hidden min-h-full ">
   <!-- Actions -->
   <div class="flex shrink-0 items-center  sm:mt-0 sm:ml-4 py-8 px-6 md:px-8 justify-between">
    <!-- Search -->
    <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64" [subscriptSizing]="'dynamic'">
      <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:search'"></mat-icon>
      <input matInput  [autocomplete]="'off'" [placeholder]="'Buscar'">
    </mat-form-field>
    <!-- Add product button -->
    <button class="ml-4" mat-flat-button [color]="'primary'" >
      <span class="ml-2 mr-1">Novo Agendamento</span>
    </button>
  </div>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="processNumber">
      <th mat-header-cell *matHeaderCellDef> Número do processo </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Tipo </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>

    <ng-container matColumnDef="subType">
      <th mat-header-cell *matHeaderCellDef> Subtipo </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>
    
    <ng-container matColumnDef="owner">
      <th mat-header-cell *matHeaderCellDef> Responsável </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>
    
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>
    
    <ng-container matColumnDef="internDeadline">
      <th mat-header-cell *matHeaderCellDef> Prazo interno </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>
    
    <ng-container matColumnDef="local">
      <th mat-header-cell *matHeaderCellDef> Local </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>

    <ng-container matColumnDef="observation">
      <th mat-header-cell *matHeaderCellDef> Observação </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let element"> - </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[15, 25, 30]" [showFirstLastButtons]="true">
  </mat-paginator>
</div>
