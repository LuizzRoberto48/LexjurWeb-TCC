<div class="xl:col-span-2 flex flex-col flex-auto overflow-hidden min-h-full ">

  <!-- Actions -->
  <div class="flex shrink-0 items-center  sm:mt-0 sm:ml-4 py-8 px-6 md:px-8 justify-between">
    <!-- Search -->
    <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64" [subscriptSizing]="'dynamic'">
      <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:search'"></mat-icon>
      <input matInput [formControl]="searchInputControl" [autocomplete]="'off'" [placeholder]="'Buscar'">
    </mat-form-field>
    <!-- Add product button -->
    <button class="ml-4" mat-flat-button [color]="'primary'" (click)="dialogResource()">
      <span class="ml-2 mr-1">Criar recurso</span>
    </button>
  </div>


  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Name Column -->
    <ng-container matColumnDef="resourceNumber">
      <th mat-header-cell *matHeaderCellDef> Número do recurso </th>
      <td mat-cell *matCellDef="let element"> {{element.number}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="origin">
      <th mat-header-cell *matHeaderCellDef> Origem </th>
      <td mat-cell *matCellDef="let element"> {{element.origin}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="uf">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let element"> {{element.uf}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="county">
      <th mat-header-cell *matHeaderCellDef> Comarca </th>
      <td mat-cell *matCellDef="let element"> {{element.county}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="forum">
      <th mat-header-cell *matHeaderCellDef> Foro </th>
      <td mat-cell *matCellDef="let element"> {{element.forum}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="organ">
      <th mat-header-cell *matHeaderCellDef> Orgão </th>
      <td mat-cell *matCellDef="let element"> {{element.forum}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="instance">
      <th mat-header-cell *matHeaderCellDef> Instância </th>
      <td mat-cell *matCellDef="let element"> {{element.instance}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element"> {{element.status}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="resourceType">
      <th mat-header-cell *matHeaderCellDef> Tipo do recurso </th>
      <td mat-cell *matCellDef="let element"> {{element.resourceType}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon class="icon-size-4 text-gray-600" svgIcon="edit"></mat-icon>
            <span>Editar</span>
          </button>
          <button mat-menu-item>
            <mat-icon class="icon-size-4 text-gray-600" svgIcon="remove_circle_outline"></mat-icon>
            <span>Remover</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[15, 25, 30]" [showFirstLastButtons]="true">
  </mat-paginator>
</div>
