  <!-- Header -->

        <!-- Avatar and name -->
        <div class="flex flex-auto items-center min-w-0">

          <div class="flex flex-col min-w-0 ml-4">
            <div class="text-4xl font-extrabold tracking-tight leading-none">Processos</div>
            <div class="flex items-center space-x-2">
              <a class="text-primary cursor-pointer" [routerLink]="['/processos']">Home
              </a>
              <div class="">/</div>
              <!-- <ng-container *ngFor="let path of items.path; let last = last; trackBy: trackByFn">
                  <ng-container *ngIf="!last">
                      <a
                          class="text-primary cursor-pointer"
                          [routerLink]="['/apps/file-manager/folders/', path.id]">{{path.name}}</a>
                  </ng-container>
                  <ng-container *ngIf="last">
                      <div>{{path.name}}</div>
                  </ng-container>
                  <ng-container *ngIf="!last">
                      <div class="">/</div>
                  </ng-container>
              </ng-container> -->
            </div>
          </div>
        </div>
        <!-- Actions -->
        <!-- <div class="flex items-center mt-6 sm:mt-0 sm:ml-2 space-x-3">

          <button mat-flat-button [color]="'primary'" (click)="newProcess()">
            <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
            <span class="ml-2 mr-1">Novo processo</span>
          </button>
        </div> -->
      </div>
      <!-- Project selector -->
      <div
        class="relative flex self-start pt-2 pb-1 pl-5 pr-4 cursor-pointer overflow-hidden rounded-t-xl border border-b-0 bg-default"
        matRipple [matMenuTriggerFor]="processesMenu">
        <div class="flex items-center">
          <div class="overflow-hidden">
            <div class="font-medium leading-6 truncate">{{currentItem.name}}</div>
          </div>
          <div class="flex items-center justify-center pl-2">
            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:chevron-down'"></mat-icon>
          </div>
        </div>
        <mat-menu #processesMenu="matMenu" [xPosition]="'before'">
          <ng-container  *ngFor="let item of items">
            <button mat-menu-item (click)="changeItem(item)" >{{item.name}}</button>
          </ng-container>
        </mat-menu>
      </div>

    </div>



  </div>
  <!-- Main -->
  <div class="flex-auto border-t ">
    <router-outlet></router-outlet>
  </div>
