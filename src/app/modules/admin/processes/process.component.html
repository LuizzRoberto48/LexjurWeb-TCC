<div class="flex flex-col flex-auto min-w-0">
  <!-- Header -->
  <div class="bg-card">
    <div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 sm:px-8">
      <div class="flex flex-col sm:flex-row flex-auto sm:items-center min-w-0 my-8 sm:my-12">
        <!-- Avatar and name -->
        <div class="flex flex-auto items-center min-w-0">

          <div class="flex flex-col min-w-0 ml-4 flex">
            <div class="text-4xl font-extrabold tracking-tight leading-none  flex flex-row" >
               <p>Processos</p> 
              <mat-chip-listbox aria-label="Fish selection" class=" ml-4" style="margin-top: -0.2rem;">
                <mat-chip-option color="accent" selected>Núcleo: Júpter</mat-chip-option>
              </mat-chip-listbox>
            </div>
            <div class="flex items-center space-x-2">
              <a class="text-primary cursor-pointer" [routerLink]="['/processos']">Home
              </a>
              <div class="">/</div>
              
            </div>
          </div>
        </div>
       
      </div>
      <!-- Project selector -->
      <div
        class="relative flex self-start pt-2 pb-1 pl-5 pr-4 cursor-pointer overflow-hidden rounded-t-xl border border-b-0 bg-default"
        matRipple [matMenuTriggerFor]="processesMenu">
        <div class="flex items-center">
          <div class="overflow-hidden">
            <div class="font-medium leading-6 truncate">{{currentItem.name}}</div>
          </div>
          <div class="flex items-center justify-center pl-2">
            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:chevron-down'"></mat-icon>
          </div>
        </div>
        <mat-menu #processesMenu="matMenu" [xPosition]="'before'">
          <ng-container  *ngFor="let item of items">
            <button mat-menu-item (click)="changeItem(item)" >{{item.name}}</button>
          </ng-container>
        </mat-menu>
      </div>

    </div>



  </div>
  <!-- Main -->
  <div class="flex-auto border-t ">
    <router-outlet></router-outlet>
  </div>
</div>
