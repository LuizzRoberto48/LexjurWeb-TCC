<div class="inset-0 flex flex-col min-w-0 overflow-hidden w-full">
  <mat-drawer-container [hasBackdrop]="true">
    <mat-drawer
      [disableClose]="true"
      mode="side"
      [opened]="isOpened"
      position="end"
      class="mat-drawer w-full md:w-160 dark:bg-gray-900 mat-drawer-side mat-drawer-opened"
    >
      <files-form
        (onClose)="isOpened = $event"
        [processId]="$processId | async"
      ></files-form>
    </mat-drawer>
    <mat-drawer-content class="bg-white" style="min-height: 70vh; ">
      <!-- Actions -->
      <div
        class="flex shrink-0 items-center sm:mt-0 py-8 px-6 md:px-6 justify-between"
      >
        <!-- Search -->
        <mat-form-field
          class="fuse-mat-dense fuse-mat-rounded min-w-64"
          [subscriptSizing]="'dynamic'"
        >
          <mat-icon
            class="icon-size-5"
            matPrefix
            [svgIcon]="'heroicons_solid:search'"
          ></mat-icon>
          <input matInput [autocomplete]="'off'" [placeholder]="'Buscar'" />
        </mat-form-field>
        <ng-container>
          <button
            class="ml-4"
            mat-flat-button
            [color]="'primary'"
            (click)="newFile()"
          >
            <span class="ml-2 mr-1">Novo arquivo</span>
          </button>
        </ng-container>
      </div>
      <mat-divider
        role="separator"
        class="mat-divider mt-3 mb-8 mat-divider-horizontal"
        aria-orientation="horizontal"
      ></mat-divider>
      <div
        class="flex shrink-0 items-center sm:mt-0 px-6 md:px-6 w-full gap-4"
        *ngIf="isFilterTarget"
      >
        <mat-button-toggle-group
          name="targets"
          multiple
          (change)="onToggleChange($event)"
        >
          <ng-container *ngFor="let target of uploadProcessFile.targetList">
            <mat-button-toggle
              class="rounded-3xl text-sm bg-gray-100"
              [value]="target"
              [checked]="selectedTargets.includes(target)"
            >
              <span>{{ target | titlecase }}</span>
            </mat-button-toggle>
          </ng-container>
        </mat-button-toggle-group>
      </div>
      <div class="flex flex-col items-start mt-3 px-6 md:px-6" style="min-height: 40vh;">
        <div class="font-medium">Meus arquivos</div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
          <ng-container *ngFor="let file of selectedFiles">
            <upload-file-card
              [uploadType]="uploadProcessFile.findCardFile(file)"
              (clicked)="isOpened = !isOpened; sendUploadFile(file)"
            ></upload-file-card>
          </ng-container>
        </div>
      </div>
      <div class="relative md:absolute bottom-0 flex flex-col w-full py-5 ">
        <div class="flex flex-row text-center justify-center gap-4">
          <button mat-stroked-button color="primary">Anterior</button>
          <button mat-stroked-button color="accent">Próximo</button>
        </div>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
