<div
  class="flex flex-col w-30 h-32 mt-5 shadow rounded-2xl cursor-pointer bg-card"
>
  <ng-container *ngIf="!service.closeBtn">
    <mat-icon
      [svgIcon]="'heroicons_outline:x'"
      class="min-h-2 min-w-2 ml-auto m-1 h-5 w-5"
      (click)="close()"
    ></mat-icon>
  </ng-container>
  <div
    class="flex flex-col items-center justify-between h-full pb-2 m-2"
    (click)="onClick()"
    [class.-mt-2]="!service.closeBtn"
  >
    <div class="text-base font-semibold text-gray-500">
      {{ uploadType?.target ?? 'Processo' }}
    </div>
    <div class="relative">
      <mat-icon
        class="icon-size-10 text-hint opacity-50"
        [svgIcon]="'heroicons_solid:document'"
      ></mat-icon>
      <div
        class="absolute bottom-0 left-0 rounded text-sm font-semibold leading-5 text-white flex-start px-1"
        [class.bg-excell]="uploadType.extensions.includes('xls')"
        [class.bg-blue-400]="uploadType.extensions.includes('doc')"
        [class.bg-red-600]="uploadType.extensions === 'pdf'"
        [class.bg-gray-600]="uploadType.extensions === 'png'"
        [class.bg-amber-600]="uploadType.extensions === 'jpeg'"
      >
        {{ uploadType?.name.toUpperCase() }}
      </div>
    </div>
    <div class="text-base font-normal mt-2 text-gray-500 text-sm">
      {{ uploadType.label | truncate : 10 }}
    </div>
  </div>
</div>
