<div class="bg-card sm:bg-white bg-gray-100">
  <div class="flex flex-col w-full mx-auto px-6 sm:px-12 py-6">
    <div class="mb-3">
      <gl-breadcrumb></gl-breadcrumb>
    </div>
    <div
      class="flex flex-col sm:flex-row flex-auto sm:items-center min-w-0 mb-8 sm:mb-4"
    >
      <!-- Avatar and name -->
      <div class="flex flex-auto items-center min-w-0">
        <div class="flex-col mt-2">
          <mat-icon class="w-16 h-16" [svgIcon]="titleIcon"></mat-icon>
        </div>
        <div class="flex flex-col min-w-0 ml-4">
          <div
            class="text-2xl md:text-5xl font-semibold tracking-tight leading-7 md:leading-snug truncate"
          >
            {{ title }}
          </div>

          <div class="flex items-center">
            <mat-icon class="icon-size-5" [svgIcon]="descIcon"></mat-icon>
            <div class="ml-1.5 leading-6 truncate text-secondary">
              {{ desc }}
            </div>
          </div>
          <ng-container *ngIf="hasCoreBtn">
            <div class="flex items-center mt-2">
              <button mat-stroked-button changeCore>
                Núcleo: <span>{{ coreName }}</span>
              </button>
            </div>
          </ng-container>
        </div>
      </div>
      <!-- Actions -->
      <div class="flex items-center mt-6 sm:mt-0 sm:ml-2 space-x-3">
        <ng-content select="[content]"></ng-content>
      </div>
    </div>
  </div>
</div>
